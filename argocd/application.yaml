apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-security-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/isaaaac-2/secure-gitops-aks.git
    targetRevision: HEAD
    path: helm/sample-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
